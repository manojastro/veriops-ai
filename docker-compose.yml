# VeriOps AI — full local stack.  `docker compose up --build`  then open http://localhost:3000
name: veriops

x-python: &python
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
    secrets: [build_ca]
  image: veriops-python:local
  env_file:
    - path: .env
      required: false
  environment: &python-env
    APP_ENV: local
    DATABASE_URL: postgresql+psycopg://veriops:veriops@postgres:5432/veriops
    REDIS_URL: redis://redis:6379/0
    SIMULATOR_URL: http://simulator:8100
    TELEMETRY_BACKEND: http
    EXECUTION_MODE: worker
    LLM_PROVIDER: ${LLM_PROVIDER:-simulated}
    JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0001}
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    CORS_ORIGINS: http://localhost:3000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veriops
      POSTGRES_PASSWORD: veriops
      POSTGRES_DB: veriops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriops -d veriops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  simulator:
    <<: *python
    command: ["python", "-m", "veriops.simulator.app"]
    environment:
      <<: *python-env
      HEALTHCHECK_URL: http://127.0.0.1:8100/health
    ports: ["8100:8100"]

  api:
    <<: *python
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      simulator: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *python
    command: ["python", "-m", "veriops.worker.main"]
    environment:
      <<: *python-env
      OTEL_SERVICE_NAME: veriops-worker
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      simulator: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      secrets: [build_ca]
      args:
        API_INTERNAL_URL: http://api:8000
    image: veriops-web:local
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otel/config.yaml:ro
    ports: ["4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:

secrets:
  # Optional CA bundle for builds behind a TLS-intercepting proxy. Empty by default.
  build_ca:
    file: ${BUILD_CA_BUNDLE:-/dev/null}
