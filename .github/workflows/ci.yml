name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  LLM_PROVIDER: simulated
  TELEMETRY_BACKEND: inprocess

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/ruff format --check src tests scripts
      - run: .venv/bin/mypy

  unit:
    name: Unit, graph & safety-critical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - name: Safety-critical tests (unsafe scaling must be rejected)
        run: .venv/bin/pytest -m critical -o addopts="" -v
      - name: Unit tests with coverage
        run: .venv/bin/pytest tests/unit -o addopts="" --cov=veriops --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veriops
          POSTGRES_PASSWORD: veriops
          POSTGRES_DB: veriops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veriops" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://veriops:veriops@localhost:5432/veriops
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - name: Migrations (upgrade → downgrade → upgrade)
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic downgrade base && .venv/bin/alembic upgrade head
      - run: .venv/bin/pytest tests/integration -o addopts="" -v

  evaluation:
    name: Agent evaluation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - name: Run evaluation (fails if accuracy/unsafe-rejection thresholds are not met)
        run: .venv/bin/python -m veriops.evaluation.cli --output reports/evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: reports/evaluation.json

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - name: Bandit (SAST)
        run: .venv/bin/bandit -q -r src -c pyproject.toml
      - name: pip-audit (known vulnerabilities)
        run: .venv/bin/pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit (high+)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend type check, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  kubernetes:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize infra/kubernetes/base > rendered-base.yaml
      - run: kubectl kustomize infra/kubernetes/overlays/remediation-enabled > rendered-remediation.yaml
      - run: >-
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas
          /w/rendered-base.yaml /w/rendered-remediation.yaml

  terraform:
    name: Terraform (Azure reference architecture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build

  e2e:
    name: End-to-end demo (docker compose + Playwright)
    runs-on: ubuntu-latest
    needs: [unit, frontend, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -sf localhost:8000/health/ready && curl -sf -o /dev/null localhost:3000/login && exit 0
            sleep 3
          done
          docker compose ps; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose logs api worker simulator --tail 200
