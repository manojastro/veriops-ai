# Default deny ingress; only the ingress controller reaches web/api, and only api/worker reach the simulator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [veriops-web, veriops-api] }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
spec:
  podSelector:
    matchLabels: { app: veriops-api }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: veriops-web } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-simulator-clients
spec:
  podSelector:
    matchLabels: { app: veriops-simulator }
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [veriops-api, veriops-worker] }
      ports: [{ port: 8100 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [veriops-api, veriops-worker] }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
