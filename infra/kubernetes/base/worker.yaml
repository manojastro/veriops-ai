apiVersion: apps/v1
kind: Deployment
metadata:
  name: veriops-worker
  labels: { app: veriops-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: veriops-worker }
  template:
    metadata:
      labels: { app: veriops-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: veriops
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: veriops-python
          command: ["python", "-m", "veriops.worker.main"]
          ports: [{ name: metrics, containerPort: 9100 }]
          envFrom:
            - configMapRef: { name: veriops-config }
            - secretRef: { name: veriops-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes: [{ name: tmp, emptyDir: {} }]
