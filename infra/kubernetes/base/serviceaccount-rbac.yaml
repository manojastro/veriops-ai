# VeriOps observes the cluster READ-ONLY by default. Write access (scale / rollback) is an explicit,
# separately reviewed opt-in: see overlays/remediation-enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: veriops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: veriops-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: veriops-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: veriops-readonly
subjects:
  - kind: ServiceAccount
    name: veriops
    namespace: veriops
