# Secrets are NOT stored in git. In Azure they are synced from Key Vault by the Secrets Store CSI
# driver (see infra/terraform/azure). This SecretProviderClass maps Key Vault secrets to the
# `veriops-secrets` Kubernetes Secret consumed by the deployments.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: veriops-keyvault
spec:
  provider: azure
  secretObjects:
    - secretName: veriops-secrets
      type: Opaque
      data:
        - { objectName: database-url, key: DATABASE_URL }
        - { objectName: redis-url, key: REDIS_URL }
        - { objectName: jwt-secret, key: JWT_SECRET }
        - { objectName: azure-openai-endpoint, key: AZURE_OPENAI_ENDPOINT }
        - { objectName: azure-openai-api-key, key: AZURE_OPENAI_API_KEY }
        - { objectName: azure-openai-deployment, key: AZURE_OPENAI_DEPLOYMENT }
  parameters:
    usePodIdentity: "false"
    clientID: "<workload-identity-client-id>"
    keyvaultName: "<key-vault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - objectName: database-url
          objectType: secret
        - objectName: redis-url
          objectType: secret
        - objectName: jwt-secret
          objectType: secret
        - objectName: azure-openai-endpoint
          objectType: secret
        - objectName: azure-openai-api-key
          objectType: secret
        - objectName: azure-openai-deployment
          objectType: secret
