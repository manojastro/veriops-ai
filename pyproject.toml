[project]
name = "veriops"
version = "0.1.0"
description = "VeriOps AI — autonomous production investigation with verified remediation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "sse-starlette>=2.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-redis",
]

[project.scripts]
veriops-api = "veriops.api.main:run"
veriops-worker = "veriops.worker.main:run"
veriops-simulator = "veriops.simulator.app:run"
veriops-eval = "veriops.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veriops"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]
"migrations/**" = ["E501"]
# Only static filter clauses are interpolated; all values are bound parameters.
"src/veriops/rag/store.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
files = ["src/veriops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires PostgreSQL (DATABASE_URL)",
  "e2e: requires the full docker compose stack",
  "evals: agent evaluation suite",
  "critical: safety-critical tests that must never fail",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
